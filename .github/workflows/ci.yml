name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    tags: ["v*.*.*"]

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: Check formatting (black)
        run: black --check src tests
      - name: Check import order (isort)
        run: isort --check-only --profile black src tests
      - name: Lint (flake8)
        run: flake8 src tests

  test:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: Run tests with coverage
        run: pytest -v

  build-and-push:
    runs-on: ubuntu-latest
    needs: test
    # Runs on merges to main AND on version tags. PRs never publish an image.
    if: github.event_name == 'push'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Compute image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,format=long
            type=ref,event=tag
      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}

  trigger-airflow:
    # Only for version tags, and only after the tagged image exists.
    needs: build-and-push
    if: startsWith(github.ref, 'refs/tags/v')
    # Runs on YOUR machine so 127.0.0.1 reaches your local Airflow.
    runs-on: self-hosted
    steps:
      - name: Trigger churn_training_dag
        shell: powershell
        env:
          AIRFLOW_BASE_URL: ${{ secrets.AIRFLOW_BASE_URL }}
          AIRFLOW_USERNAME: ${{ secrets.AIRFLOW_USERNAME }}
          AIRFLOW_PASSWORD: ${{ secrets.AIRFLOW_PASSWORD }}
          IMAGE_TAG: ${{ github.ref_name }}
        run: |
          $pair = "$($env:AIRFLOW_USERNAME):$($env:AIRFLOW_PASSWORD)"
          $auth = [Convert]::ToBase64String([Text.Encoding]::ASCII.GetBytes($pair))
          $body = @{ conf = @{ image_tag = $env:IMAGE_TAG } } | ConvertTo-Json -Depth 5
          Invoke-RestMethod -Method Post `
            -Uri "$($env:AIRFLOW_BASE_URL)/api/v1/dags/churn_training_dag/dagRuns" `
            -Headers @{ Authorization = "Basic $auth" } `
            -ContentType "application/json" `
            -Body $body
